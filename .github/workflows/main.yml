name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove temp.txt files
        run: find . -name "temp.txt" -type f -delete

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env and .env.example files
        env:
          MY_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$MY_KEY" ]; then MY_KEY="dummy_key"; fi
          echo "GEMINI_API_KEY=\"$MY_KEY\"" > .env
          echo "GEMINI_API_KEY=\"dummy_key\"" > .env.example

      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catatan-Keuangan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
